# Configuration spécifique à ton DTO de contact
products:
  message: "Welcome to Library Product Catalogue local APIs"
  contactDetails:
    name: "Catalogue Team"
    email: "catalog@library.com"
  onCallSupport:
    - (555) 888-9999

spring:
  # Configuration RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Configuration de la Base de données
  datasource:
    url: jdbc:postgresql://localhost:5432/products
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  liquibase:
    enabled: true

  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

management:
  endpoints:
    web:
      exposure:
        include: "*"
