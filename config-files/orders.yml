# --- Propriétés personnalisées que tu as créées ---
orders:
  message: "Welcome to Easycom Order Processing local APIs"
  contactDetails:
    name: "Sales Team - Order Dept"
    email: "sales-engine@library.com"
  onCallSupport:
    - (555) 444-5555
    - (555) 444-6666

# --- Configuration RabbitMQ ---
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # --- Datasource ---
  datasource:
    url: jdbc:postgresql://localhost:5434/orders
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # --- Liquibase ---
  liquibase:
    enabled: true
    
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

# --- Eureka Server Specific Configuration ---
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

# --- Monitoring and Health Configuration ---
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

# --- Info Endpoint Configuration ---
info:
  app:
    name: ${spring.application.name}
    description: "Easycom Orders Microservice"
    version: "1.0.0"
