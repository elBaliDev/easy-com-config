users:
  message: "Welcome to Easycom User Management local APIs"
  contactDetails:
    name: "User Team - Identity Dept"
    email: "users-support@library.com"
  onCallSupport:
    - (555) 111-2222

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Base de données Users
  datasource:
    url: jdbc:postgresql://localhost:5433/users
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  liquibase:
    enabled: true

  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

# --- Eureka Server Specific Configuration ---
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

# --- Monitoring and Health Configuration ---
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

# --- Info Endpoint Configuration ---
info:
  app:
    name: ${spring.application.name}
    description: "Easycom Users Microservice"
    version: "1.0.0"
